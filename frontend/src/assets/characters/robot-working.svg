<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Robot Working - Animated/working appearance with gears and blinking light -->

  <!-- Antenna -->
  <rect x="95" y="20" width="10" height="20" fill="#a4a4a4"/>
  <!-- Blinking light -->
  <circle cx="100" cy="15" r="8" fill="#a4a44a">
    <animate attributeName="opacity" values="1;0.3;1" dur="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Head -->
  <rect x="60" y="40" width="80" height="60" rx="10" fill="#4a90a4"/>
  <!-- Face plate -->
  <rect x="65" y="45" width="70" height="50" rx="8" fill="#a4a4a4"/>

  <!-- Working eyes - wide open -->
  <circle cx="85" cy="65" r="14" fill="#4a90a4">
    <animate attributeName="r" values="14;12;14" dur="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85" cy="65" r="10" fill="#a4a44a">
    <animate attributeName="fill" values="#a4a44a;#ffff00;#a4a44a" dur="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="65" r="14" fill="#4a90a4">
    <animate attributeName="r" values="14;12;14" dur="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="65" r="10" fill="#a4a44a">
    <animate attributeName="fill" values="#a4a44a;#ffff00;#a4a44a" dur="0.3s" repeatCount="indefinite"/>
  </circle>

  <!-- Eye highlights -->
  <circle cx="82" cy="62" r="3" fill="#ffffff"/>
  <circle cx="112" cy="62" r="3" fill="#ffffff"/>

  <!-- Working mouth - determined -->
  <rect x="75" y="78" width="50" height="12" rx="6" fill="#4a90a4"/>

  <!-- Neck -->
  <rect x="90" y="100" width="20" height="10" fill="#a4a4a4"/>

  <!-- Body -->
  <rect x="55" y="110" width="90" height="70" rx="10" fill="#4a90a4"/>

  <!-- Body panel -->
  <rect x="65" y="120" width="70" height="50" rx="5" fill="#a4a4a4"/>

  <!-- Working gear on chest -->
  <g transform="translate(100, 145)">
    <circle cx="0" cy="0" r="15" fill="#4a90a4"/>
    <g>
      <rect x="-18" y="-3" width="36" height="6" fill="#a4a4a4"/>
      <rect x="-3" y="-18" width="6" height="36" fill="#a4a4a4"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="#a4a44a"/>
  </g>

  <!-- Arms - working position -->
  <!-- Left arm pointing/working -->
  <rect x="25" y="110" width="20" height="55" rx="8" fill="#a4a4a4">
    <animate attributeName="x" values="25;30;25" dur="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="23" y="160" width="24" height="15" rx="5" fill="#4a90a4"/>

  <!-- Right arm holding tool -->
  <rect x="155" y="110" width="20" height="55" rx="8" fill="#a4a4a4">
    <animate attributeName="x" values="155;150;155" dur="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="153" y="160" width="24" height="15" rx="5" fill="#4a90a4"/>

  <!-- Legs - active stance -->
  <!-- Left leg -->
  <rect x="60" y="180" width="25" height="15" rx="5" fill="#a4a4a4">
    <animate attributeName="x" values="60;65;60" dur="0.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Right leg -->
  <rect x="115" y="180" width="25" height="15" rx="5" fill="#a4a4a4">
    <animate attributeName="x" values="115;110;115" dur="0.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Steam/sparks effect -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="0.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;40;50" dur="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="45" r="2" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="45;35;45" dur="0.5s" repeatCount="indefinite"/>
  </circle>
</svg>