<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Robot Idle - Friendly standing pose -->

  <!-- Antenna -->
  <rect x="95" y="20" width="10" height="20" fill="#a4a4a4"/>
  <circle cx="100" cy="15" r="8" fill="#a4a44a"/>

  <!-- Head -->
  <rect x="60" y="40" width="80" height="60" rx="10" fill="#4a90a4"/>
  <!-- Face plate -->
  <rect x="65" y="45" width="70" height="50" rx="8" fill="#a4a4a4"/>

  <!-- Eyes -->
  <circle cx="85" cy="65" r="12" fill="#4a90a4"/>
  <circle cx="85" cy="65" r="8" fill="#a4a44a"/>
  <circle cx="115" cy="65" r="12" fill="#4a90a4"/>
  <circle cx="115" cy="65" r="8" fill="#a4a44a"/>

  <!-- Eye highlights -->
  <circle cx="82" cy="62" r="3" fill="#ffffff"/>
  <circle cx="112" cy="62" r="3" fill="#ffffff"/>

  <!-- Mouth -->
  <rect x="80" y="80" width="40" height="8" rx="4" fill="#4a90a4"/>

  <!-- Neck -->
  <rect x="90" y="100" width="20" height="10" fill="#a4a4a4"/>

  <!-- Body -->
  <rect x="55" y="110" width="90" height="70" rx="10" fill="#4a90a4"/>

  <!-- Body panel -->
  <rect x="65" y="120" width="70" height="50" rx="5" fill="#a4a4a4"/>

  <!-- Chest display -->
  <rect x="75" y="130" width="50" height="30" rx="3" fill="#4a90a4"/>
  <circle cx="90" cy="145" r="5" fill="#a4a44a"/>
  <circle cx="110" cy="145" r="5" fill="#a4a44a"/>

  <!-- Arms -->
  <!-- Left arm -->
  <rect x="30" y="115" width="20" height="50" rx="8" fill="#a4a4a4"/>
  <rect x="28" y="160" width="24" height="15" rx="5" fill="#4a90a4"/>

  <!-- Right arm -->
  <rect x="150" y="115" width="20" height="50" rx="8" fill="#a4a4a4"/>
  <rect x="148" y="160" width="24" height="15" rx="5" fill="#4a90a4"/>

  <!-- Legs -->
  <!-- Left leg -->
  <rect x="65" y="180" width="25" height="15" rx="5" fill="#a4a4a4"/>

  <!-- Right leg -->
  <rect x="110" y="180" width="25" height="15" rx="5" fill="#a4a4a4"/>
</svg>