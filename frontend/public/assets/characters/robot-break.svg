<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Robot Break - Relaxed/break pose with closed eyes -->

  <!-- Antenna - droopy -->
  <rect x="95" y="30" width="10" height="15" fill="#a4a4a4">
    <animate attributeName="x" values="95;93;95" dur="2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="100" cy="30" r="6" fill="#a4a44a"/>

  <!-- Head - slightly tilted -->
  <rect x="60" y="50" width="80" height="60" rx="10" fill="#4a90a4">
    <animate attributeName="transform" type="rotate" values="0 100 80;3 100 80;0 100 80" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Face plate -->
  <rect x="65" y="55" width="70" height="50" rx="8" fill="#a4a4a4">
    <animate attributeName="transform" type="rotate" values="0 100 80;3 100 80;0 100 80" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Closed eyes - peaceful -->
  <path d="M 75 65 Q 85 70 95 65" stroke="#4a90a4" stroke-width="4" fill="none" stroke-linecap="round">
    <animate attributeName="d" values="M 75 65 Q 85 70 95 65;M 75 65 Q 85 68 95 65;M 75 65 Q 85 70 95 65" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 105 65 Q 115 70 125 65" stroke="#4a90a4" stroke-width="4" fill="none" stroke-linecap="round">
    <animate attributeName="d" values="M 105 65 Q 115 70 125 65;M 105 65 Q 115 68 125 65;M 105 65 Q 115 70 125 65" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Peaceful smile -->
  <path d="M 85 85 Q 100 95 115 85" stroke="#4a90a4" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Neck - relaxed -->
  <rect x="90" y="110" width="20" height="10" fill="#a4a4a4"/>

  <!-- Body - relaxed posture -->
  <rect x="55" y="120" width="90" height="60" rx="10" fill="#4a90a4"/>

  <!-- Body panel -->
  <rect x="65" y="130" width="70" height="40" rx="5" fill="#a4a4a4"/>

  <!-- Relaxed chest display - low power -->
  <rect x="75" y="140" width="50" height="20" rx="3" fill="#4a90a4"/>
  <circle cx="90" cy="150" r="3" fill="#a4a44a" opacity="0.5"/>
  <circle cx="110" cy="150" r="3" fill="#a4a44a" opacity="0.5"/>

  <!-- Arms - relaxed at sides -->
  <!-- Left arm - down -->
  <rect x="35" y="125" width="18" height="45" rx="8" fill="#a4a4a4">
    <animate attributeName="x" values="35;33;35" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="33" y="165" width="22" height="12" rx="4" fill="#4a90a4"/>

  <!-- Right arm - down -->
  <rect x="147" y="125" width="18" height="45" rx="8" fill="#a4a4a4">
    <animate attributeName="x" values="147;149;147" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="145" y="165" width="22" height="12" rx="4" fill="#4a90a4"/>

  <!-- Legs - seated/relaxed -->
  <!-- Left leg - sitting -->
  <rect x="60" y="180" width="30" height="12" rx="4" fill="#a4a4a4"/>

  <!-- Right leg - sitting -->
  <rect x="110" y="180" width="30" height="12" rx="4" fill="#a4a4a4"/>

  <!-- ZZZ sleep indicators -->
  <text x="150" y="40" font-family="Arial" font-size="14" fill="#a4a44a" opacity="0">
    Z
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="40;30;40" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="160" y="30" font-family="Arial" font-size="12" fill="#a4a44a" opacity="0">
    z
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="30;20;30" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </text>
</svg>